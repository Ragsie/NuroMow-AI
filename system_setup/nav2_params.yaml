# ==============================================================================
# NuroMow ROS 2 Navigation2 (Nav2) Parameterkonfiguration
# Optimeret til Orange Pi 5 Ultra & GXIVISION 3D Stereo Virtual LiDAR scan
# ==============================================================================

amcl:
  ros__parameters:
    use_sim_time: False
    # Bemærk: AMCL er deaktiveret i NuroMows aktive RTK-GPS navigations-launch,
    # da positionen leveres direkte af robot_localization (EKF) og RTK-GPS.

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_frame: odom
    default_bt_xml_filename: "navigate_to_pose_w_replanning_and_recovery.xml"
    plugin_lib_names:
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_recompute_path_to_pose_action_bt_node
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress Checker
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    # Goal Checker (Centimeter-præcision matchet med RTK-GPS)
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05  # 5 cm tolerance (RTK muliggør dette!)
      yaw_goal_tolerance: 0.08 # Ca. 4.5 graders vinkeltolerance

    # Goal Checker (Centimeter-præcision matchet med RTK-GPS)
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05  # 5 cm tolerance (RTK muliggør dette!)
      yaw_goal_tolerance: 0.08 # Ca. 4.5 graders vinkeltolerance

    # 🆕 RPP-styrede hastigheds- og styreparametre til det asymmetriske Worx-chassis:
    # Vi reducerer max linear fart en smule for højere præcision nær forhindringer.
    # Lookahead_dist tilpasses dynamisk til at give en blødere indstyring.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.38  # 🆕 Reduceret fra 0.45 for øget kontrol ved asymmetriske sving
      lookahead_dist: 0.5       # 🆕 Reduceret fra 0.6 for at reagere hurtigere på snævre grænser
      min_lookahead_dist: 0.25  # 🆕 Reduceret fra 0.3 for snævre sving nær bede
      max_lookahead_dist: 0.8
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.30
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: True
      use_regulated_linear_velocity_scaling: True
      regulated_linear_scaling_min_radius: 0.8
      regulated_linear_scaling_min_speed: 0.12 # 🆕 Sænket fart i skarpe sving for at undgå skred
      use_cost_regulated_linear_velocity_scaling: True
      cost_scaling_dist: 0.5                  # 🆕 Øget fra 0.4 - start deceleration tidligere
      cost_scaling_factor: 12.0               # 🆕 Mere kognitiv og følsom opbremsning nær hjørner
      inflation_cost_scaling_factor: 4.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: False
    planner_plugins: ["GridBased"]

    # Global ruteplanlægger (Grid-baseret NavFn - robust og hurtig på RK3588)
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.1
      use_astar: True # Anvend A* søgealgoritme i stedet for Dijkstra for lavere CPU-belastning

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      robot_radius: {ROBOT_RADIUS} # 🆕 Dynamisk indsprøjtet # Worx Landroid M600 fysisk radius (inkl. margen)
      resolution: 0.05   # 5 cm gridopløsning
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      # Forhindringskortlægning baseret på vores Virtuelle LiDAR scan
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 1.5
          min_obstacle_height: 0.05
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.1
          obstacle_max_range: 2.2 # Hold klipperen fokuseret på nære forhindringer
          obstacle_min_range: 0.1

      # Inflationslag (Hvor tæt må vi køre på forhindringer)
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 8.0
        inflation_radius: {INFLATION_RADIUS} # 🆕 Dynamisk indsprøjtet # Giver ca 7-10 cm sikkerhedsmargen ud over robotradius

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: True
      width: 4.0   # 4 x 4 meter lokalt arbejdsvindue omkring klipperen
      height: 4.0
      resolution: 0.05
      robot_radius: {ROBOT_RADIUS} # 🆕 Dynamisk indsprøjtet
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 1.5
          min_obstacle_height: 0.05
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.1
          obstacle_max_range: 2.2
          obstacle_min_range: 0.1

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 8.0
        inflation_radius: {INFLATION_RADIUS} # 🆕 Dynamisk indsprøjtet

recoveries_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    recovery_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_recoveries/Spin"
    backup:
      plugin: "nav2_recoveries/BackUp"
    wait:
      plugin: "nav2_recoveries/Wait"

robot_navigator:
  ros__parameters:
    use_sim_time: False