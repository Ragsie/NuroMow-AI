services:
  # 1. MICRO-ROS AGENT
  microros_agent:
    image: microros/micro-ros-agent:humble
    container_name: microros_agent
    network_mode: "host" 
    privileged: true 
    volumes:
      - /dev:/dev
    command: serial --dev /dev/ttyUSB0 -v6
    restart: unless-stopped

  # 2. YOLO AI SAFETY NODE (Pulled from external registry or built locally)
  yolo_safety:
    image: ragsie/worx_yolo_safety:latest
    container_name: yolo_safety
    network_mode: "host"
    devices:
      - "/dev/video0:/dev/video0" 
    restart: unless-stopped

  # 3. TOF SENSOR NODE
  tof_sensors:
    image: ragsie/worx_tof_sensors:latest
    container_name: tof_sensors
    network_mode: "host"
    devices:
      - "/dev/i2c-1:/dev/i2c-1" 
    restart: unless-stopped

  # 4. ROSBRIDGE WEB SOCKET (For Foxglove / Web UI)
  rosbridge:
    image: ragsie/worx_rosbridge:latest
    # NOTE: If pulling fails, uncomment the 'build' line below and point it to the folder with the Dockerfile
    # build: ./path_to_your_rosbridge_folder
    container_name: rosbridge
    network_mode: "host"
    restart: unless-stopped

  # 5. ROS 2 NAV2 CORE (Placeholder / future navigation)
  ros2_nav:
    image: ros:humble-ros-base
    container_name: ros2_nav
    network_mode: "host"
    command: tail -f /dev/null 
    restart: unless-stopped