services:
# 1. MICRO-ROS AGENT (Drivemotorer - VESC)
  microros_agent_drive:
    image: microros/micro-ros-agent:humble
    container_name: microros_agent_drive
    network_mode: "host"
    privileged: true
    volumes:
      - /dev:/dev
    command: serial --dev /dev/ttyUSB0 -v6
    restart: unless-stopped

  # 2. MICRO-ROS AGENT (Cuttermotor-VESC)
  microros_agent_cutter:
    image: microros/micro-ros-agent:humble
    container_name: microros_agent_cutter
    network_mode: "host"
    privileged: true
    volumes:
      - /dev:/dev
    command: serial --dev /dev/ttyUSB1 -v6
    restart: unless-stopped

  # 4. ROSBRIDGE WEB SOCKET (For Foxglove / Web UI)
  rosbridge:
    image: ragsie/worx-rosbridge:latest
    # NOTE: If pulling fails, uncomment the 'build' line below and point it to the folder with the Dockerfile
    # build: ./path_to_your_rosbridge_folder
    container_name: rosbridge
    network_mode: "host"
    restart: unless-stopped

  # 5. ROS 2 NAV2 CORE (Placeholder / future navigation)
  ros2_nav:
    image: ros:humble-ros-base
    container_name: ros2_nav
    network_mode: "host"
    command: tail -f /dev/null 
    restart: unless-stopped

  stereo_vision:
    image: ragsie/worx-stereo-vision:latest
    container_name: stereo_vision
    network_mode: "host"
    privileged: true # Required for direct NPU (/dev/rknn) access on Orange Pi
    volumes:
      - /dev:/dev  # Gives access to camera and /dev/rknn
      # Mount your TrueNAS NFS share (you have to mount it on your Orange Pi host first)
      # Format: /path/on/orange-pi : /path/to/the/container : read-only 
      - /mnt/nfs/deploy:/mnt/truenas_deploy:ro
      - /dev:/dev # Mounts all devices, ensuring /dev/rknn and /dev/video* are available
    environment:
      # --- CAMERA CONFIGURATION ---
      - CAMERA_INDEX=0
      - CAMERA_WIDTH=2560
      - CAMERA_HEIGHT=720
      - CAMERA_FPS=10
      # --- STEREO CALIBRATION ---
      # BASELINE: The physical distance between the two lenses in meters (e.g., 6 cm = 0.06)
      - CAMERA_BASELINE=0.06
      # FOCAL_LENGTH: The focal length in pixels (requires camera calibration, approx 700 for 720p)
      - CAMERA_FOCAL_LENGTH=700.0
      # MIN_SAFE_DISTANCE: The distance in meters that triggers the E-STOP
      - MIN_SAFE_DISTANCE=1.0
    restart: unless-stopped
