services:
  # 1. MICRO-ROS AGENT (Drivemotorer - VESC)
  microros_agent_drive:
    image: microros/micro-ros-agent:humble
    container_name: microros_agent_drive
    network_mode: "host"
    privileged: true
    volumes:
      - /dev:/dev
    command: serial --dev /dev/ttyUSB0 -v6
    restart: unless-stopped

  # 2. MICRO-ROS AGENT (Cuttermotor - VESC)
  microros_agent_cutter:
    image: microros/micro-ros-agent:humble
    container_name: microros_agent_cutter
    network_mode: "host"
    privileged: true
    volumes:
      - /dev:/dev
    command: serial --dev /dev/ttyUSB1 -v6
    restart: unless-stopped

  # 3. ROSBRIDGE WEB SOCKET (For Foxglove / Web UI)
  rosbridge:
    image: ragsie/worx-rosbridge:latest
    container_name: rosbridge
    network_mode: "host"
    restart: unless-stopped

  # 4. ROS 2 NAV2 CORE (Placeholder / future navigation)
  ros2_nav:
    image: ros:humble-ros-base
    container_name: ros2_nav
    network_mode: "host"
    command: >
      bash -c "apt-get update && apt-get install -y ros-humble-slam-toolbox && ros2 run slam_toolbox async_slam_toolbox_node"
    restart: unless-stopped

  # 5. STEREO VISION & AI
  stereo_vision:
    image: ragsie/worx-stereo-vision:latest
    container_name: stereo_vision
    network_mode: "host"
    privileged: true
    volumes:
      - ${LOCAL_STORAGE_PATH}:/mnt/storage
      - /dev:/dev
    environment:
      - UPLOAD_RAW_FRAMES=${UPLOAD_RAW_FRAMES}
      - STORAGE_PATH=/mnt/storage/${RAW_UPLOAD_FOLDER}
      - CAMERA_INDEX=0
      - CAMERA_WIDTH=2560
      - CAMERA_HEIGHT=720
      - CAMERA_FPS=10
      - CAMERA_BASELINE=0.06
      - CAMERA_FOCAL_LENGTH=700.0
      - MIN_SAFE_DISTANCE=1.0
    restart: unless-stopped

  # 6. WATCHTOWER (Auto-Updater)
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup
    restart: unless-stopped

  # 7. auramow-seg & PointCloud 3D Fusion Node
  depth_fusion:
    image: ragsie/auramow-depth-fusion:latest
    container_name: depth_fusion
    network_mode: "host"
    privileged: true
    volumes:
      - /dev:/dev
    environment:
      - MIN_SAFE_DISTANCE=1.0
    restart: unless-stopped
    depends_on:
      - stereo_vision