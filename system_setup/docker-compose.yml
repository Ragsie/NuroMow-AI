version: '3.8'

services:
  # Stereo Vision Service (Virtual LiDAR scan-generering)
  stereo_vision:
    build:
      context: ../stereo_vision
      dockerfile: Dockerfile
    container_name: nuromow_stereo_vision
    restart: unless-stopped
    network_mode: host
    ipc: host
    devices:
      - /dev/video_stereo:/dev/video_stereo
    volumes:
      - /dev/shm:/dev/shm
    env_file: # 🆕 [TILFØJET: Send hardware-parametre dynamisk til containeren]
      - ./nuromow.env
    environment:
      - ROS_DOMAIN_ID=1

  # ROSbridge Websocket Service (API- og App-kommunikation)
  rosbridge_websocket:
    build:
      context: ../rosbridge_websocket
      dockerfile: Dockerfile
    container_name: nuromow_rosbridge
    restart: unless-stopped
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=1

  # RKNN NPU AI Inference (YOLOv26-seg hindringskortlægning)
  depth_fusion:
    build:
      context: ../depth_fusion
      dockerfile: Dockerfile
    container_name: nuromow_depth_fusion
    restart: unless-stopped
    network_mode: host
    ipc: host
    devices:
      - /dev/rknn:/dev/rknn
      - /dev/dri:/dev/dri
    volumes:
      - /dev/shm:/dev/shm
      - /opt/nuromow/models:/models
      - /opt/nuromow/incoming_raw:/incoming_raw
    environment:
      - ROS_DOMAIN_ID=1

  # App Backend (Statusoversigt, GPS RTK og kontrol-broker)
  app_backend:
    build:
      context: ../app_backend
      dockerfile: Dockerfile
    container_name: nuromow_app_backend
    restart: unless-stopped
    network_mode: host
    devices:
      - /dev/ttyUSB_gps_rover:/dev/ttyUSB_gps_rover
    environment:
      - ROS_DOMAIN_ID=1