version: '3.8'

services:
  # Stereo Vision Service (Virtual LiDAR scan generation from dual MIPI CSI)
  stereo_vision:
    build:
      context: ../stereo_vision
      dockerfile: Dockerfile
    container_name: omnimow_stereo_vision
    restart: unless-stopped
    network_mode: host
    ipc: host
    # Updated: Gives container access to both MIPI CSI video streams
    devices:
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
    volumes:
      - /dev/shm:/dev/shm
    env_file:
      - ./omnimow.env
    environment:
      - ROS_DOMAIN_ID=1

  # ROSbridge Websocket Service (API and app communication)
  rosbridge_websocket:
    build:
      context: ../rosbridge_websocket
      dockerfile: Dockerfile
    container_name: omnimow_rosbridge
    restart: unless-stopped
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=1

  # Updated: Qualcomm NPU AI Inference via ONNX Runtime & QNN Execution Provider
  depth_fusion:
    build:
      context: ../depth_fusion
      dockerfile: Dockerfile
    container_name: omnimow_depth_fusion
    restart: unless-stopped
    network_mode: host
    ipc: host
    # Updated: Gives container full access to Qualcomm DSP/NPU FastRPC user channels
    devices:
      - /dev/fastrpc-adsp:/dev/fastrpc-adsp
      - /dev/fastrpc-cdsp:/dev/fastrpc-cdsp
      - /dev/fastrpc-cdsp-secure:/dev/fastrpc-cdsp-secure
      - /dev/dri:/dev/dri
    volumes:
      - /dev/shm:/dev/shm
      - /opt/omnimow/models:/models
      - /opt/omnimow/incoming_raw:/incoming_raw
      - /lib/firmware:/lib/firmware:ro  # Mounts proprietary firmware blobs for Hexagon DSP
    env_file:
      - ./omnimow.env
    environment:
      - ROS_DOMAIN_ID=1

  # App Backend (status overview, GPS RTK, and control broker)
  app_backend:
    build:
      context: ../app_backend
      dockerfile: Dockerfile
    container_name: omnimow_app_backend
    restart: unless-stopped
    network_mode: host
    devices:
      - /dev/ttyUSB_gps_rover:/dev/ttyUSB_gps_rover
    environment:
      - ROS_DOMAIN_ID=1