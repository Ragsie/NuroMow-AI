name: OmniMow Kodekvalitet og Statisk Analyse

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Hent kildekode (Checkout)
      uses: actions/checkout@v4

    - name: Indlæs OmniMow miljøvariabler fra omnimow.env til GitHub Actions
      run: |
        grep -v '^#' system_setup/omnimow.env >> $GITHUB_ENV

    - name: Opsæt Python Miljø
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # Aktiverer automatisk caching af pip-pakker

    - name: Installer testværktøjer og static analyzers
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        sudo apt-get update && sudo apt-get install -y cppcheck shellcheck

    - name: Python Statisk Analyse (flake8)
      run: |
        # Stop processen ved syntaksfejl eller udefinerede variabler i de aktive Python-moduler
        flake8 stereo_vision/ depth_fusion/ docking_control/ app_backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Advarsler og stilmæssig kontrol (Resten af koden)
        flake8 stereo_vision/ depth_fusion/ docking_control/ app_backend/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: C++ Firmware Analyse (cppcheck)
      run: |
        cppcheck --enable=all --suppress=missingIncludeSystem ./esp32_code/

    - name: Shell Script Analyse (shellcheck)
      run: |
        # Statisk analyse af robottens opsætnings- og startscripts
        shellcheck system_setup/host_setup.sh stereo_vision/start_vision.sh