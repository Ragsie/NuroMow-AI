name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  python-test:
    name: Python Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies (flake8 and pytest)
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          # Uncomment the line below if you have a requirements.txt file:
          # pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Python tests with pytest
        run: |
          # This will automatically find and run all tests in your Python files
          # pytest # skipped for now

  shell-check:
    name: Shell Script Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck on all .sh files
        run: |
          # Finds all .sh files in the repo and checks them for errors
          find . -type f -name "*.sh" -exec shellcheck {} +

  esp32-build:
    name: ESP32 Build (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio
      
      - name: Build Cutter Controller
        run: |
          pio run -d esp32_code/Cutter_Controller/

      - name: Build Drive Controller
        run: |
          pio run -d esp32_code/Drive_Controller/

  docker-check:
    name: Dockerfile Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test Docker build for ToF Sensor
        run: |
          # Build ToF sensor Dockerfile
          docker build -t tof-sensor-test -f tof_sensor_node/Dockerfile tof_sensor_node/

      - name: Test Docker build for yolo ai node
        run: |
         # build YOLO safty Dockerfile
         docker build -t second-docker-test -f yolo_safety_node/Dockerfile yolo_safety_node/
