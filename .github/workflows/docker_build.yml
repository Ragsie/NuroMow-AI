name: Build Worx Mower Containers

on:
  push:
    branches: 
      - 'main'
    tags:
      - 'v*.*.*'
    paths:
      - 'yolo_safety_node/**'
      - 'tof_sensor_node/**'
      - 'rosbridge_websocket/**'
      - '.github/workflows/**' 

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ===================================
      # 1. STEREO VISION & NPU YOLO NODE
      # ===================================
      - name: AIVision
        id: meta-stereo
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/worx-stereo-vision
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build Stereo Vision Node
        uses: docker/build-push-action@v6
        with:
          context: ./stereo_vision_node
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta-stereo.outputs.tags }}
          labels: ${{ steps.meta-stereo.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ==========================================
      # 3. ROSBRIDGE WEBSOCKET
      # ==========================================
      - name: Rosbridge
        id: meta-rosbridge
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/worx-rosbridge
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build Rosbridge WebSocket
        uses: docker/build-push-action@v6
        with:
          context: ./rosbridge_websocket
          push: true
          platforms: linux/arm64,linux/amd64
          tags: ${{ steps.meta-rosbridge.outputs.tags }}
          labels: ${{ steps.meta-rosbridge.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
