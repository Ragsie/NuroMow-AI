name: Build and Push Multi-Arch Docker Image

on:
  push:
    branches:
      - main
    # 1. NEW: Trigger the workflow when you push a SemVer tag to GitHub
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 2. NEW: Extract metadata (tags, labels) for Docker
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Define the base image names for both registries
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/my-app
            ghcr.io/${{ github.repository_owner }}/my-app
          
          # Define the tagging rules
          tags: |
            # Tag with the branch name (e.g., 'main')
            type=ref,event=branch
            
            # Tag with the Git SHA (e.g., 'sha-ad132f5')
            type=sha
            
            # Generate SemVer tags on git tag push (e.g., from 'v1.2.3')
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # 3. NEW: Inject the tags and labels generated by the metadata action
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
